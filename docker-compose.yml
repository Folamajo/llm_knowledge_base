
services:
  app: #Service name, the name of the container. Docker will refer to it by this name internally
    build: . #
    ports:
    - "8000:8080"
    volumes:
    - .:/app
    env_file:
        - .env

  postgres:
    image: postgres
    env_file:
      - .env
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: llm_knowledge_db

volumes:
   postgres_data: {}